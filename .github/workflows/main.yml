name: Construir APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar Repositório
      uses: actions/checkout@v4

    - name: ☕ Configurar Java (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🤖 Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: ⚙️ Instalar Dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git wget unzip

    - name: 🛠️ Compilar o APK
      run: |
        # Substitua pelo comando que o seu projeto usa para gerar o APK
        # Exemplo com Gradle:
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📦 Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          app/build/outputs/apk/**/*.apk
          *.apk
